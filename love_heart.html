<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Heart</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#060208; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { width:min(100vw,100vh); height:min(100vw,100vh); display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 800, H = 800;
const SC = 21, OY = 20, DURATION = 10000, TICK = 16, ANIM = 42, LIFT = 34, GAP = 7;
const SIZES = [9, 10, 11, 12];
const PT = 1.333; // tkinter point -> css px
const FONT = "Arial, 'Noto Sans', sans-serif";
const BG = "#060208";

const PHRASES = [
  "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
  "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
  "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
  "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
  "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
];

// ---------- canvas setup ----------
const dpr = window.devicePixelRatio || 1;
const cv = document.getElementById("c");
cv.width = W * dpr; cv.height = H * dpr;
const ctx = cv.getContext("2d");
const off = document.createElement("canvas");
off.width = W * dpr; off.height = H * dpr;
const octx = off.getContext("2d");
ctx.setTransform(dpr, 0, 0, dpr, W / 2 * dpr, H / 2 * dpr);
octx.setTransform(dpr, 0, 0, dpr, W / 2 * dpr, H / 2 * dpr);

// ---------- seeded random ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(11);
const uniform = (a, b) => a + rand() * (b - a);
const choice = arr => arr[Math.floor(rand() * arr.length)];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- helpers ----------
const clamp = v => Math.max(0, Math.min(1, v));
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const dim = (c, k) => c.map(v => v * k);
const hx = c => "#" + c.map(v => Math.round(clamp(v) * 255).toString(16).padStart(2, "0")).join("");

function heart(a) {
  const x = 16 * Math.pow(Math.sin(a), 3);
  const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
  return [x * SC, y * SC + OY];
}

const POLY = [];
for (let i = 0; i < 720; i++) POLY.push(heart(2 * Math.PI * i / 720));
const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
const YMAX = Math.max(...POLY.map(p => p[1]));
const YMIN = Math.min(...POLY.map(p => p[1]));
const CY = (YMAX + YMIN) / 2;

function spans(y) {
  const xs = [];
  for (const [[x1, y1], [x2, y2]] of EDGES) {
    if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
      xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
    }
  }
  xs.sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i + 1 < xs.length; i += 2) out.push([xs[i], xs[i + 1]]);
  return out;
}

function intersect(A, B) {
  const out = [];
  for (const a of A) for (const b of B) {
    const lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
    if (hi - lo > 14) out.push([lo, hi]);
  }
  return out;
}

const mctx = document.createElement("canvas").getContext("2d");
function measure(text, px) {
  mctx.font = `bold ${px}px ${FONT}`;
  return mctx.measureText(text).width;
}

function* phraseCycle() {
  while (true) for (const p of shuffle(PHRASES)) yield p;
}

const radDist = (x, y) => Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));

// ---------- layout ----------
function build() {
  const cycle = phraseCycle();
  const rowH = Math.max(...SIZES) * PT * 1.25 + 4;
  const half = rowH / 2;
  const placed = [];

  let y = YMAX - half;
  while (y > YMIN + half) {
    const row = intersect(spans(y + half), spans(y - half));

    for (let [lo, hi] of row) {
      lo += 4; hi -= 4;
      let cur = lo + uniform(0, 8);
      const line = [];

      while (true) {
        let fit = null;
        for (let k = 0; k < 10; k++) {
          const text = cycle.next().value;
          const size = choice(SIZES);
          const px = size * PT;
          const w = measure(text, px);
          if (cur + w <= hi) { fit = { text, px, w }; break; }
        }
        if (!fit) break;
        line.push({ x: cur + fit.w / 2, text: fit.text, px: fit.px, w: fit.w });
        cur += fit.w + GAP;
      }
      if (!line.length) continue;

      if (line.length > 1) {
        const last = line[line.length - 1];
        const left = hi - (last.x + last.w / 2);
        line.forEach((it, i) => { it.x += left * i / (line.length - 1); });
      } else {
        line[0].x = (lo + hi) / 2;
      }

      line.forEach((it, i) => {
        placed.push({
          x: it.x, y, text: it.text, px: it.px,
          edge: i === 0 || i === line.length - 1
        });
      });
    }
    y -= rowH;
  }

  const wine = [0.58, 0.0, 0.09], crimson = [0.90, 0.05, 0.14], blood = [0.98, 0.10, 0.16];
  for (const p of placed) {
    const rad = Math.min(1.0, radDist(p.x, p.y));
    let base = mix(wine, crimson, 0.25 + 0.75 * rad);
    base = mix(base, blood, uniform(0, 0.35) + (p.edge ? 0.3 : 0));
    p.color = base.map(v => Math.min(1, v));
    p.rad = rad;
  }

  const edges = placed.filter(p => p.edge);
  const inner = placed.filter(p => !p.edge);
  const TWO_PI = 2 * Math.PI;
  edges.forEach(p => { p.key = ((Math.atan2(p.x, p.y - CY) % TWO_PI) + TWO_PI) % TWO_PI; });
  inner.forEach(p => { p.key = -p.rad + uniform(0, 0.08); });
  edges.sort((a, b) => a.key - b.key);
  inner.sort((a, b) => a.key - b.key);
  return edges.concat(inner);
}

// ---------- animation ----------
const BGC = [1, 3, 5].map(i => parseInt(BG.slice(i, i + 2), 16) / 255);
const FLASH = [1.0, 0.78, 0.78];
const ORDER = build();
const RATE = ORDER.length / (DURATION / TICK);

let idx = 0, acc = 0, spawning = true;
const active = [];
const done = [];
const shimmers = [];
let lastShimmer = 0;

function drawP(g, p, u) {
  const e = 1 - Math.pow(1 - u, 3);
  const c = p.color;
  const x = p.x, y = -p.y;
  const hover = (1 - e) * LIFT;
  const ax = x + p.dx * (1 - e), ay = y - hover;

  g.textAlign = "center";
  g.textBaseline = "middle";

  g.font = `bold ${p.px}px ${FONT}`;
  g.fillStyle = hx(mix(BGC, dim(c, 0.30), e));
  g.fillText(p.text, x + 2, y + 3);

  g.font = `bold ${p.px + PT}px ${FONT}`;
  g.fillStyle = hx(mix(BGC, dim(c, 0.20), e * e));
  g.fillText(p.text, ax, ay);

  g.font = `bold ${p.px}px ${FONT}`;
  const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
  g.fillStyle = hx(mix(mix(BGC, c, Math.pow(e, 1.5)), FLASH, flash));
  g.fillText(p.text, ax, ay);
}

function frame(now) {
  if (spawning) {
    acc += RATE;
    while (acc >= 1 && idx < ORDER.length) {
      acc -= 1;
      const p = ORDER[idx++];
      p.f = 0;
      p.dx = uniform(-10, 10);
      active.push(p);
    }
    if (idx >= ORDER.length) spawning = false;
  }

  for (let i = active.length - 1; i >= 0; i--) {
    const p = active[i];
    p.f++;
    if (p.f / ANIM >= 1) {
      drawP(octx, p, 1);
      done.push(p);
      active.splice(i, 1);
    }
  }

  ctx.fillStyle = BG;
  ctx.fillRect(-W / 2, -H / 2, W, H);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(off, 0, 0);
  ctx.restore();

  for (const p of active) drawP(ctx, p, clamp(p.f / ANIM));

  // shimmer after everything has landed
  if (!spawning && active.length === 0 && done.length) {
    if (now - lastShimmer > 140) {
      lastShimmer = now;
      shimmers.push({ p: choice(done), until: now + 260 });
    }
  }
  for (let i = shimmers.length - 1; i >= 0; i--) {
    const s = shimmers[i];
    if (now > s.until) { shimmers.splice(i, 1); continue; }
    ctx.font = `bold ${s.p.px}px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = hx(mix(s.p.color, FLASH, 0.6));
    ctx.fillText(s.p.text, s.p.x, -s.p.y);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
